name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Ensure npm CLI supports trusted publishing
        run: npm install -g npm@^11.5.1
      - name: Verify tag matches package version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$VERSION" != "$TAG" ]; then
            echo "Tag $TAG does not match package version $VERSION"
            exit 1
          fi
      - name: Verify repository URL
        run: |
          node -e '
            const url = require("./package.json").repository.url.replace(/^git\+/, "").replace(/\.git$/, "");
            const expected = `https://github.com/${process.env.GITHUB_REPOSITORY}`;
            if (url !== expected) {
              console.error(`repository.url ${url} must match ${expected} for trusted publishing`);
              process.exit(1);
            }
          '
      - name: Verify the package exists on npm
        run: |
          if ! npm view pi-deepseek-web-tools version >/dev/null 2>&1; then
            echo "Package pi-deepseek-web-tools does not exist on npm. Run the Bootstrap Publish workflow first."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Check whether the version is already published
        id: published
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "pi-deepseek-web-tools@$VERSION" version >/dev/null 2>&1; then
            echo "Already published: $VERSION"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Determine the dist-tag
        id: dist_tag
        run: |
          node -e '
            const version = require("./package.json").version;
            const dash = version.indexOf("-");
            const prerelease = dash === -1 ? "" : version.slice(dash + 1);
            const prefix = prerelease.match(/^[A-Za-z]+/);
            const tag = prerelease === "" ? "latest" : prefix ? prefix[0] : "next";
            console.log(`Publishing ${version} under the ${tag} dist-tag`);
            require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\n`);
          '
      - name: Publish to npm with trusted publishing
        if: steps.published.outputs.skip != 'true'
        run: npm publish --access public --tag "${{ steps.dist_tag.outputs.tag }}"
